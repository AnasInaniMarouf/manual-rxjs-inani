<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Planetario</title>
    <link rel="icon" href="imgs/SistemaSolarIcono.png">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="ts/script.ts" defer></script>
</head>
<body>
    <main>
        <div id="tierra">
            <h1>Tiempo en la Tierra</h1>
            <hr>
            <p id="tiempoTierra" class="tiempo">0 años, 0 meses, 0 dias</p>
        </div>
        <div id="velocidad">
            <input type="button" value="x1" id="bx1" class="bVelocidad">
            <input type="button" value="x10" id="bx10" class="bVelocidad">
            <input type="button" value="x100" id="bx100" class="bVelocidad">
        </div>
        <div id="marte">
            <h1>Tiempo en Marte</h1>
            <hr>
            <p id="tiempoMarte" class="tiempo">0 años, 0 meses, 0 dias</p>
        </div>
    </main>
</body>
</html>
